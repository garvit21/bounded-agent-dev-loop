name: Verify Agent Harness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: |
          python -m ruff check app agent verification workspace audit

      - name: Mypy
        run: |
          python -m mypy app agent verification workspace audit

      - name: Run harness tests
        run: |
          python -m pytest \
            tests/test_baseline.py \
            tests/test_workspace_manager.py \
            tests/test_verification_runner.py \
            tests/test_context_builder.py \
            tests/test_risk_gate.py \
            tests/test_implementer.py \
            tests/test_graph.py \
            tests/test_cli.py \
            tests/test_audit_recorder.py \
            tests/test_end_to_end_mock.py \
            -v